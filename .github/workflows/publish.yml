name: Publish Package

on:
  push:
    branches:
      - main
  # for manual testing
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'
      tags:
        description: 'Test scenario tags' 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v3
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true
      - name: uv sync
        run: uv sync --locked
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.7
        with:
          versionSpec: '5.x'
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.7
        with:
          useConfigFile: true
          configFilePath: ".github/gitversion.yml"
      - name: Version
        # Only rewrite the project version line. uv.lock still records 0.1.0 after this,
        # so later steps must not re-lock or run `uv sync --locked`.
        run: sed -i "s/^version = \"0\.1\.0\"$/version = \"$GITVERSION_MAJORMINORPATCH\"/" pyproject.toml
      - name: 'Build Package'
        run: uv build
      - name: Upload to PythonPackages
        run: |
          uv run --no-sync python -m twine upload dist/* --config-file .pypirc
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASS }}
          TWINE_REPOSITORY: python-packages
      - name: Tag Repo
        run: |
          git config --global user.email "auto@github"
          git config --global user.name "Github Automation"
          git tag -a "v$GITVERSION_MAJORMINORPATCH" -m "Release $GITVERSION_MAJORMINORPATCH"
          git push --tags