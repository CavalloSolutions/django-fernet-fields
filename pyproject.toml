[project]
name = "cav-django-fernet-fields"
version = "0.1.0"
description = "Fernet-encrypted model fields for Django"
authors = [{ name = "Brian Werth", email = "brian.werth@Cavallo.com" }]
requires-python = ">=3.10,<4.0"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = ["django>=4.2.5,<5.0.0"]

[dependency-groups]
dev = [
    "black>=22.12.0,<23",
    "flake8>=6.0.0,<7",
    "pytest>=7.1,<8",
    "twine>=6.1.0,<7",
]

[tool.uv.build-backend]
module-name = "fernet_fields"
module-root = ""

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
